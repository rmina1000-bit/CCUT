active:
  asr: whisper_vulkan
  vl: null
  intent: null

providers:
  whisper:
    adapter: WhisperAdapter
    config:
      model_size: base
      device: cpu

  whisper_vulkan:
    adapter: WhisperVulkanAdapter
    config:
      cli_path: runtime/whisper-vulkan/whisper-cli.exe
      model_path: runtime/whisper-vulkan/models/ggml-small.bin
      fallback_model_path: runtime/whisper-vulkan/models/ggml-base.bin
      model_size: small
      threads: 6

  qwen3_asr:
    adapter: Qwen3ASRAdapter
    config:
      server_binary: D:/CCUT1.0.4/tools/llama.cpp-vulkan/llama-server.exe
      model_path: D:/CCUT1.0.4/ccut_backend/ai_models/qwen3-asr-1.7b/Qwen3-ASR-1.7B-Q8_0.gguf
      mmproj_path: D:/CCUT1.0.4/ccut_backend/ai_models/qwen3-asr-1.7b/mmproj-Qwen3-ASR-1.7B-Q8_0.gguf
      port: 8091
      ctx_size: 4096
      n_gpu_layers: 99

fallback:
  asr: whisper
  vl: null

network_policy:
  allow_external_ai: false
  allow_model_download: true
  trusted_endpoints: []

health_check_interval_sec: 300
