<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCUT Interaction Basic Spec Runner</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0d1117;
      color: #e5e7eb;
    }

    .runner-shell {
      height: 100%;
      display: grid;
      grid-template-rows: 180px 1fr;
      gap: 12px;
      padding: 12px;
    }

    .runner-card {
      border: 1px solid rgba(96, 165, 250, 0.25);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.92);
      padding: 12px 14px;
    }

    .runner-card pre {
      margin: 8px 0 0;
      white-space: pre-wrap;
      font: 16px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      max-height: 120px;
      overflow: auto;
    }

    .runner-frame {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      background: #0d1117;
    }
  </style>
</head>

<body>
  <div class="runner-shell">
    <div class="runner-card">
      <strong>CCUT Interaction Basic Spec Runner</strong>
      <pre id="interaction-basic-status">Starting...</pre>
    </div>
    <iframe id="interaction-basic-frame" class="runner-frame" title="CCUT interaction basic frame"></iframe>
  </div>
  <script id="interaction-basic-json" type="application/json">{"pass":false,"status":"pending"}</script>
  <script type="module" src="/src/smoke/interactionBasicRunner.ts"></script>
</body>

</html>
